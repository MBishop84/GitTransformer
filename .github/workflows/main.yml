name: Deploy to GitHub Pages

env:
  NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PUBLISH_ROOT: GitTransformer/bin/Release/net10.0/publish
  PUBLISH_DIR: GitTransformer/bin/Release/net10.0/publish/wwwroot

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4.3.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GitTransformer.sln

      - name: Publish Blazor WebAssembly project
        run: dotnet publish GitTransformer/GitTransformer.csproj --configuration Release --no-restore -o ${{ env.PUBLISH_ROOT }}

      - name: Update base href (if needed)
        shell: bash
        run: |
          if [ -f "${{ env.PUBLISH_DIR }}/index.html" ]; then
            sed -i 's#<base href="/" />#<base href="/GitTransformer/" />#g' "${{ env.PUBLISH_DIR }}/index.html" || true
          else
            echo "index.html not found in ${{ env.PUBLISH_DIR }}" >&2
            exit 1
          fi

      - name: Prepare site folder
        shell: bash
        run: |
          set -e
          PUBLISH_DIR="${{ env.PUBLISH_DIR }}"
          if [ ! -d "$PUBLISH_DIR" ]; then
            echo "Publish dir not found: $PUBLISH_DIR" >&2
            exit 1
          fi
          rm -rf ./site
          mkdir -p ./site
          cp -a "$PUBLISH_DIR/." ./site
          touch ./site/.nojekyll
          cp ./site/index.html ./site/404.html

      - name: Show prepared site (debug)
        run: |
          echo "== ./site =="
          ls -la ./site || true
          echo "== ./site/_framework =="
          ls -la ./site/_framework || true

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          folder: ./site
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gh-pages
          clean: true